[project]
name = "brand-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",
    "open_clip_torch>=2.26",
    "torch>=2.7",
    "boto3>=1.35",
    "tqdm>=4.66",
    "tzdata>=2026.5",
]

[project.scripts]
brand-agent = "brand_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brand_agent"]

# RTX 50-series (Blackwell) needs CUDA 12.8 wheels.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
